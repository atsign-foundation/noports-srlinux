name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions: # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  release:
    permissions:
      contents: write # create the GitHub release and upload the deb
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: agent/go.sum
      # Build a deb per architecture: SR Linux container images are
      # multi-arch (amd64 + arm64), so arm64 debs enable native labs on
      # Apple Silicon in addition to arm-based hardware.
      - name: Build debs (amd64 + arm64)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for ARCH in amd64 arm64; do
            FETCH_ARCH=x64; [ "$ARCH" = arm64 ] && FETCH_ARCH=arm64
            rm -f build/sshnpd build/at_activate build/noports-agent
            (cd agent && GOARCH="$ARCH" go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o ../build/noports-agent .)
            ARCH="$FETCH_ARCH" ./scripts/fetch-sshnpd.sh
            docker run --rm -e VERSION="$VERSION" -e ARCH="$ARCH" \
              -v $PWD:/tmp/pkg -w /tmp/pkg \
              goreleaser/nfpm package --config nfpm.yaml --packager deb --target build/
          done
          ls -la build/*.deb
      - name: Create release (or attach deb to a UI-created one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Release was created in the GitHub UI: respect its
            # pre-release/latest flags as chosen there; just attach the deb.
            gh release upload "$GITHUB_REF_NAME" build/*.deb --clobber
          else
            # Bare tag push: create the release here. Semver pre-release
            # tags (e.g. v0.2.0-rc1) become pre-releases; plain tags become
            # the latest release.
            case "$GITHUB_REF_NAME" in
              *-*) FLAG="--prerelease" ;;
              *)   FLAG="--latest" ;;
            esac
            gh release create "$GITHUB_REF_NAME" build/*.deb \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --notes "Packages sshnpd $(cat SSHNPD_VERSION) for Nokia SR Linux." \
              "$FLAG"
          fi
