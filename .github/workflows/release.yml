name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions: # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  release:
    permissions:
      contents: write # create the GitHub release and upload the deb
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.24"
          cache-dependency-path: agent/go.sum
      - name: Build noports-agent
        working-directory: agent
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
            -o ../build/noports-agent .
      - name: Fetch pinned sshnpd release binaries
        run: ./scripts/fetch-sshnpd.sh
      - name: Build deb with nFPM
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker run --rm -e VERSION="$VERSION" -v $PWD:/tmp/pkg -w /tmp/pkg \
            goreleaser/nfpm package --config nfpm.yaml --packager deb --target build/
      - name: Create release (or attach deb to a UI-created one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Release was created in the GitHub UI: respect its
            # pre-release/latest flags as chosen there; just attach the deb.
            gh release upload "$GITHUB_REF_NAME" build/*.deb --clobber
          else
            # Bare tag push: create the release here. Semver pre-release
            # tags (e.g. v0.2.0-rc1) become pre-releases; plain tags become
            # the latest release.
            case "$GITHUB_REF_NAME" in
              *-*) FLAG="--prerelease" ;;
              *)   FLAG="--latest" ;;
            esac
            gh release create "$GITHUB_REF_NAME" build/*.deb \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --notes "Packages sshnpd $(cat SSHNPD_VERSION) for Nokia SR Linux." \
              "$FLAG"
          fi
