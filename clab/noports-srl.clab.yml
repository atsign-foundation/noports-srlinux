# containerlab topology for testing NoPorts on SR Linux — no hardware needed.
#
#   containerlab deploy -t noports-srl.clab.yml
#   ssh admin@clab-noports-srl-srl1        (password: NokiaSrl1!)
#
# The SR Linux mgmt interface gets NAT'd internet access via the Docker
# bridge, so sshnpd can reach the atDirectory/atServers out of the box.
# Note: DNS inside the srbase-mgmt namespace is separate from Docker's
# resolver — if name resolution fails, check /etc/resolv.conf on the node.
name: noports-srl

topology:
  nodes:
    srl1:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:latest
      binds:
        # Mount the repo's staged artifacts straight into the node for fast
        # iteration (edit on host, `tools system app-management application
        # sshnpd restart` on the node). For the deb workflow, drop the
        # binds and `dpkg -i` the package instead.
        - ../appmgr/sshnpd.yml:/etc/opt/srlinux/appmgr/sshnpd.yml:ro
        - ../opt/sshnpd/run-sshnpd.sh:/opt/sshnpd/run-sshnpd.sh:ro
        - ../opt/sshnpd/onboard-sshnpd.sh:/opt/sshnpd/onboard-sshnpd.sh:ro
        - ../build/sshnpd:/usr/local/bin/sshnpd:ro
        - ../build/at_activate:/usr/local/bin/at_activate:ro
        # Local-only secrets dir (gitignored): sshnpd.env + atKeys file.
        - ./secrets:/etc/opt/sshnpd

    # A plain Linux box to run the sshnp client from, simulating the
    # operator's machine. Install sshnp + client atKeys here to test the
    # full end-to-end rendezvous.
    client:
      kind: linux
      image: debian:bookworm-slim
      cmd: sleep infinity

  links: []
